plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'io.github.ilyaandreev05'
version = '0.2.0'

repositories { mavenCentral() }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

javafx {
    version = '27'
    modules = [ 'javafx.controls' ]
}

dependencies {
    implementation 'io.github.mkpaz:atlantafx-base:3.0.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.20.1'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.github.ilyaandreev05.audiomatrix.AudioMatrixApp'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics,ALL-UNNAMED']
}

test { useJUnitPlatform() }

def limiterSource = file('src/main/native/audiomatrix_limiter.c')
def limiterHeader = file('src/main/native/ladspa_abi.h')
def limiterOutputDir = layout.buildDirectory.dir('generated-resources/limiter').get().asFile
def limiterOutput = new File(limiterOutputDir, 'libaudiomatrix_limiter.so')
tasks.register('compileLimiterPlugin', Exec) {
    inputs.files(limiterSource, limiterHeader)
    outputs.file(limiterOutput)
    doFirst { limiterOutputDir.mkdirs() }
    commandLine 'cc', '-std=c11', '-O2', '-fPIC', '-shared', '-Wall', '-Wextra', '-Werror',
            '-o', limiterOutput.absolutePath, limiterSource.absolutePath, '-lm'
}
tasks.named('processResources') {
    dependsOn tasks.named('compileLimiterPlugin')
    from(limiterOutputDir) { into 'native' }
}

def limiterHarnessSource = file('src/test/native/limiter_harness.c')
def limiterHarnessOutput = layout.buildDirectory.file('native-tests/limiter_harness').get().asFile
tasks.register('compileLimiterHarness', Exec) {
    inputs.files(limiterHarnessSource, limiterSource, limiterHeader)
    outputs.file(limiterHarnessOutput)
    doFirst { limiterHarnessOutput.parentFile.mkdirs() }
    commandLine 'cc', '-std=c11', '-O2', '-Wall', '-Wextra', '-Werror',
            '-o', limiterHarnessOutput.absolutePath, limiterHarnessSource.absolutePath, '-lm'
}
tasks.named('test') {
    dependsOn tasks.named('compileLimiterHarness')
    doFirst { systemProperty 'audioMatrix.limiterHarness', limiterHarnessOutput.absolutePath }
}

// Build a self-contained Debian package from the Gradle application distribution.
tasks.register('packageDeb', Exec) {
    dependsOn tasks.installDist
    doFirst {
        def jdkHome = project.findProperty('packageJdkHome') ?: System.getProperty('java.home')
        def appLib = layout.buildDirectory.dir("install/${project.name}/lib").get().asFile
        def mainJar = fileTree(appLib).matching { include "${project.name}-${project.version}.jar" }.singleFile
        def dest = layout.buildDirectory.dir('deb').get().asFile
        dest.mkdirs()
        environment 'JAVA_HOME', jdkHome
        environment 'PATH', "${jdkHome}/bin:${System.getenv('PATH')}"
        def args = ["${jdkHome}/bin/jpackage", '--type', 'deb', '--dest', dest.absolutePath,
                '--name', 'AudioMatrix', '--app-version', project.version.toString(),
                '--vendor', 'IlyaAndreev05', '--description', 'Audio Matrix mixer and PipeWire routing manager',
                '--input', appLib.absolutePath,
                '--main-jar', mainJar.name, '--main-class', application.mainClass.get(),
                '--java-options', '--module-path $APPDIR --add-modules javafx.controls --enable-native-access=javafx.graphics,ALL-UNNAMED',
                '--linux-shortcut', '--linux-menu-group', 'AudioVideo']
        if (!file("${jdkHome}/bin/jlink").exists() || !file("${jdkHome}/jmods").isDirectory())
            args.addAll(['--runtime-image', jdkHome])
        commandLine args
    }
    doLast {
        def dest = layout.buildDirectory.dir('deb').get().asFile
        def packageFile = dest.listFiles()?.find { it.name.endsWith("_${project.version}_amd64.deb") }
        if (packageFile == null) throw new GradleException('Could not locate the jpackage Debian archive to add the isolated event sink unit')
        def extracted = layout.buildDirectory.dir('deb-package-root').get().asFile
        project.delete(extracted)
        def runCommand = { List<String> command ->
            def process = new ProcessBuilder(command).inheritIO().start()
            if (process.waitFor() != 0) throw new GradleException("Command failed: ${command.first()}")
        }
        runCommand(['dpkg-deb', '--raw-extract', packageFile.absolutePath, extracted.absolutePath])
        def packageControl = new File(extracted, 'DEBIAN/control')
        def controlText = java.nio.file.Files.readString(packageControl.toPath())
        controlText = controlText.replaceFirst(/(?m)^Version:.*$/, "Version: ${project.version}")
        controlText = controlText.replaceFirst(/(?m)^Depends: (.*)$/, 'Depends: $1, python3')
        java.nio.file.Files.writeString(packageControl.toPath(), controlText)
        def unitDirectory = new File(extracted, 'opt/audiomatrix/lib/systemd/user')
        unitDirectory.mkdirs()
        copy { from file('src/main/systemd/user'); into unitDirectory }
        new File(unitDirectory, 'audiomatrix-events-loopback.sh').setExecutable(true, false)
        new File(unitDirectory, 'audiomatrix-system-sink.sh').setExecutable(true, false)
        def pipewireDropInDirectory = new File(extracted, 'opt/audiomatrix/lib/pipewire/pipewire.conf.d')
        pipewireDropInDirectory.mkdirs()
        copy { from file('src/main/pipewire/pipewire.conf.d/90-audiomatrix-system-sink.conf'); into pipewireDropInDirectory }
        def extensionId = 'audio-matrix-quick-settings@ilyaandreev05'
        def extensionDirectory = new File(extracted, "opt/audiomatrix/lib/gnome-shell/extensions/${extensionId}")
        extensionDirectory.mkdirs()
        copy { from file('gnome/audio-matrix-quick-settings'); include 'metadata.json', 'extension.js'; into extensionDirectory }
        def chromeExtensionDirectory = new File(extracted, 'opt/audiomatrix/lib/chrome/tab-capture')
        chromeExtensionDirectory.mkdirs()
        copy { from file('chrome/tab-capture'); into chromeExtensionDirectory }
        def chromeHostDirectory = new File(extracted, 'opt/audiomatrix/lib/chrome/native-host')
        chromeHostDirectory.mkdirs()
        copy { from file('chrome/native-host'); exclude 'test_host.py', '__pycache__/**'; into chromeHostDirectory }
        new File(chromeHostDirectory, 'audio-matrix-tab-capture.py').setExecutable(true, false)
        def helperDirectory = new File(extracted, 'opt/audiomatrix/bin')
        helperDirectory.mkdirs()
        copy { from file('src/main/systemd/user/audiomatrix-system-sink.sh'); into helperDirectory }
        copy { from files('scripts/enable-audiomatrix-events-service.sh', 'scripts/disable-audiomatrix-events-service.sh',
                'scripts/enable-audiomatrix-service.sh', 'scripts/disable-audiomatrix-service.sh',
                'scripts/install-gnome-quick-settings.sh', 'scripts/uninstall-gnome-quick-settings.sh',
                'scripts/install-chrome-tab-capture.sh', 'scripts/uninstall-chrome-tab-capture.sh'); into helperDirectory }
        new File(helperDirectory, 'audiomatrix-system-sink.sh').setExecutable(true, false)
        new File(helperDirectory, 'enable-audiomatrix-events-service.sh').setExecutable(true, false)
        new File(helperDirectory, 'disable-audiomatrix-events-service.sh').setExecutable(true, false)
        new File(helperDirectory, 'enable-audiomatrix-service.sh').setExecutable(true, false)
        new File(helperDirectory, 'disable-audiomatrix-service.sh').setExecutable(true, false)
        new File(helperDirectory, 'install-gnome-quick-settings.sh').setExecutable(true, false)
        new File(helperDirectory, 'uninstall-gnome-quick-settings.sh').setExecutable(true, false)
        new File(helperDirectory, 'install-chrome-tab-capture.sh').setExecutable(true, false)
        new File(helperDirectory, 'uninstall-chrome-tab-capture.sh').setExecutable(true, false)
        def rebuilt = new File(dest, packageFile.name + '.rebuilt')
        runCommand(['dpkg-deb', '--build', '--root-owner-group', extracted.absolutePath, rebuilt.absolutePath])
        java.nio.file.Files.move(rebuilt.toPath(), packageFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        project.delete(extracted)
    }
}
