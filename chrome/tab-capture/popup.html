<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Matrix Tab Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>Audio Matrix</h1>
      <p id="status" role="status" aria-live="polite">Checking tabs…</p>
    </header>
    <section aria-labelledby="active-title">
      <h2 id="active-title">Current tab</h2>
      <p id="active-tab" class="tab-title">No active tab</p>
      <button id="capture" type="button" disabled>Capture this tab</button>
    </section>
    <section aria-labelledby="tabs-title">
      <h2 id="tabs-title">Tabs</h2>
      <ul id="tabs" aria-label="Open browser tabs"></ul>
    </section>
    <footer>Capture starts only after you press the button. Closing a tab or stopping capture restores its normal playback.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
