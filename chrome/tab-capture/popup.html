<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Matrix · захват звука вкладок Chrome</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>Audio Matrix</h1>
      <p id="status" role="status" aria-live="polite">Проверяем вкладки…</p>
    </header>
    <section aria-labelledby="active-title">
      <h2 id="active-title">Текущая вкладка</h2>
      <p id="active-tab" class="tab-title">Нет активной вкладки</p>
      <button id="capture" type="button" disabled>Захватить звук вкладки</button>
    </section>
    <section aria-labelledby="tabs-title">
      <h2 id="tabs-title">Вкладки</h2>
      <ul id="tabs" aria-label="Открытые вкладки браузера"></ul>
    </section>
    <footer>Захват звука начинается только после нажатия кнопки. Остановка захвата возвращает обычное воспроизведение; закрытие вкладки завершает захват.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
